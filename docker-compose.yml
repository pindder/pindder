services:
  # -------------------------------------------------------------
  # MongoDB Database (with single-node Replica Set for Transactions)
  # -------------------------------------------------------------
  mongo:
    image: mongo:7
    container_name: pindder-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: pindder
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --port 27017 --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id:'rs0', members:[{ _id:0, host:'mongo:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      start_period: 5s
      retries: 30

  # -------------------------------------------------------------
  # Redis Cache & Lock Manager
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pindder-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # NestJS API
  # -------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pindder-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/pindder?replicaSet=rs0&directConnection=true
      REDIS_URL: redis://redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      # Pass through any other required env variables from host/.env
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}

  # -------------------------------------------------------------
  # Web Application
  # -------------------------------------------------------------
  pindder-web:
    build:
      context: .
      dockerfile: apps/pindder-web/Dockerfile
    container_name: pindder-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4800:80"

  # -------------------------------------------------------------
  # Admin Portal
  # -------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: pindder-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4500:80"

  # -------------------------------------------------------------
  # Mobile PWA Preview
  # -------------------------------------------------------------
  mobile-pwa:
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    container_name: pindder-mobile-pwa
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  mongo-data:
  redis-data:
