<form #regForm="ngForm" class="py-3">
    <ion-list>
        <ion-item lines="full">
            <ion-input 
            name="fullname"
            label="Fullname" 
            label-placement="floating" 
            fill="solid" 
            placeholder="Enter your fullname"
            [(ngModel)]="registrationData.fullname"
            ></ion-input>
        </ion-item>
        
        <ion-item lines="full">
            <ion-input
            name="email" 
            label="Email" 
            label-placement="floating" 
            fill="solid" 
            placeholder="Enter your email"
            [(ngModel)]="registrationData.email"
            ></ion-input>
        </ion-item>
        
        <ion-item lines="full">
            <ion-input 
            name="phoneNo"
            label="Telephone" 
            label-placement="floating" 
            fill="solid" 
            placeholder="Enter your phoneNo"
            [(ngModel)]="registrationData.phoneNo"
            ></ion-input>
        </ion-item>
        
        <ion-item lines="full">
            <ion-input 
            name="referral_code"
            label="Referral Code" 
            label-placement="floating" 
            fill="solid" 
            placeholder="Enter referral code"
            [(ngModel)]="registrationData.referralCode"
            ></ion-input>
        </ion-item>
    </ion-list>
</form>
