<ion-content [fullscreen]="true">
    <div class="page-container">
        <div class="flex justify-center p-3">
            <img src="images/logo.png" alt="" />
        </div>
        <ion-card class="p-3">
            <ion-segment class="" value="sign_in">
                <ion-segment-button value="sign_in" content-id="sign_in">
                    <ion-label>Sign In</ion-label>
                </ion-segment-button>
                <ion-segment-button value="sign_up" content-id="sign_up">
                    <ion-label>Sign Up</ion-label>
                </ion-segment-button>
            </ion-segment>
            <ion-segment-view>
                <ion-segment-content id="sign_in">
                    <ion-label class="flex flex-col items-center my-5">
                        <h1>Welcome back!</h1>
                        <p>Enter your email or phone number to sign in</p>
                    </ion-label>
                    <app-login></app-login>
                    <app-primary-button
                    [buttonText]="'Continue'"
                    (action)="requestLoginCode('sign_in')"
                    ></app-primary-button>
                </ion-segment-content>
                <ion-segment-content id="sign_up">
                    <ion-label class="flex flex-col items-center my-4">
                        <h1>Join Pindder!</h1>
                        <p>Pindder helps tailors stay organized.</p>
                    </ion-label>
                    <app-register></app-register>
                    <app-primary-button
                    [buttonText]="'Continue'"
                    (action)="requestLoginCode('sign_up')"
                    ></app-primary-button>
                </ion-segment-content>
            </ion-segment-view>
        </ion-card>
    </div>
</ion-content>
