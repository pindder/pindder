<ion-card class="flex flex-col gap-2 px-3 py-3">
    <ion-label>{{ data.title }}</ion-label>
    <div class="flex flex-row gap-2 items-center"> 
        <ion-icon class="circle p-1" [color]="data.color" size="large" slot="icon-only" [name]="data.icon"></ion-icon>    
        <h1>{{ data.count }}</h1> 
    </div>
</ion-card>
