<div class="m-3 flex flex-col gap-1 border">    
    <ion-item class="flex flex-row gap-2" lines="none">
        <ion-button class="custom-button" fill="outline" size="large">
            <ion-icon slot="icon-only" name="link-outline" color="primary"></ion-icon>
        </ion-button>
        <ion-label class="ml">
            <h2>Catalog Link</h2>
            <p>Share this with clients to receive orders</p>
        </ion-label>
    </ion-item>
    <ion-item lines="none">
        <div class="rounded-rectangle px-2">
            <p>https://pindder.com/{{ profile.username }}</p>
        </div>
        <ion-button (click)="action.emit()" class="ml" size="large" fill="outline">
            <ion-icon name="copy-outline" size="small" slot="icon-only"></ion-icon>
        </ion-button>
    </ion-item>
</div>
