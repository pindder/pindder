<!-- <div class="mx-3 flex flex-col gap-1 border">     -->
    <ion-card class="flex mx-3 tight-card">
        <ion-card-content>
            <div class="flex flex-row items-center gap-2" lines="none">
                <ion-button fill="outline" size="default" color="primary">
                    <ion-icon slot="icon-only" name="arrow-redo-outline"></ion-icon>
                </ion-button>
                <ion-label>
                    <h2>Catalog Link</h2>
                    <p>Share this with clients to receive orders</p>
                </ion-label>
            </div>
            <div class="w-full flex mt-2">
                <div class="px-3 rounded-rectangle">
                    <p>https://pindder.com/{{ profile.username }}</p>
                </div>
                <ion-button (click)="action.emit()" class="ml" size="default" fill="outline">
                    <ion-icon name="copy-outline" size="small" slot="icon-only"></ion-icon>
                </ion-button>
            </div>
        </ion-card-content>
    </ion-card>
