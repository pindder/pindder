<ion-header>
    <ion-toolbar>
        <ion-title>
            Client Orders
        </ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismissModal()">
                <ion-icon name="close-outline" color="primary" size="large"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div class="p-2">
        @for(order of orders; track order._id) {
            <div class="py-1">
                <ion-button 
                (click)="gotoNewOrder()"
                expand="block"
                color="primary"
                fill="outline">
                    <ion-icon name="add-outline" slot="start"></ion-icon>
                    New Order
                </ion-button>
            </div>

            <app-list-card 
                [dataType]="dataTypes.ORDER" 
                [order]="order"
                (action)="viewOrder($event)"
            >
            </app-list-card>
        } @empty {
        <div class="center">
            <app-empty-state 
                [parentComponent]="dataTypes.ORDER" 
                (action)="dismissModal(true)"
            >
            </app-empty-state>
        </div>
        }
    </div>
</ion-content>
