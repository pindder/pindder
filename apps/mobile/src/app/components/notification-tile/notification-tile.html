<ion-item-sliding>
    <ion-item-options side="start">
        <ion-item-option color="success">Archive</ion-item-option>
    </ion-item-options>

    <ion-item lines="none">
        <ion-button size="large" color="medium" slot="start">
        <ion-icon [name]="notification.icon" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-label>
        <h2 class="text-primary">{{ notification.type }}</h2>
        <p>{{ notification.message }}</p>
        </ion-label>
        <ion-icon size="small" color="danger" name="ellipse" slot="end"></ion-icon>
    </ion-item>

    <ion-item-options side="end">
        <ion-item-option color="danger">Clear</ion-item-option>
    </ion-item-options>
</ion-item-sliding>
