<ion-item-sliding>
    <!-- <ion-item-options side="start">

    <ion-item class="flex my-2 items-center gap-2" button detail (click)="viewNotification(notification)" lines="full">
        <ion-button size="large" color="medium" slot="start">
          <ion-icon size="medium" [name]="notification.icon" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-label class="ml-2">
          <h2 class="text-primary">{{ notification.title }}</h2>
          <p>{{ notification.message }}</p>
        </ion-label>
        @if(notification.status === notificationStatus.UNREAD){
          <ion-icon class="sm-icon" color="danger" name="ellipse" slot="end"></ion-icon>
        }
    </ion-item>
