<ion-header>
    <ion-toolbar>
        <ion-title>New Client</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismissModal()">
                <ion-icon name="close-outline" color="primary" size="large"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>
<ion-content>
  <form #newClientForm="ngForm" (ngSubmit)="submit()" class="my-2">
    <ion-list lines="full">
      <ion-item>
        <ion-input 
        name="firstname"
        type="text"
        [(ngModel)]="client.firstname" 
        label="Firstname" 
        labelPlacement="stacked"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input 
          name="lastname"
          type="text" 
          label="Lastname"
          labelPlacement="stacked"  
          [(ngModel)]="client.lastname"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          name="email"
          type="email"
          label="Email address (optional)"
          labelPlacement="stacked"
          [(ngModel)]="client.email"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input 
          name="phoneNo"
          label="Phone No"
          type="tel" 
          labelPlacement="stacked" 
          [(ngModel)]="client.phoneNo"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-select 
          name="gender" 
          [(ngModel)]="client.gender" 
          label="Gender" 
          aria-label="Gender" 
          placeholder="Select gender" 
          labelPlacement="stacked"
        >
          @for (gender of genders; track gender) {
            <ion-select-option [value]="gender">{{ gender }}</ion-select-option>
          }
        </ion-select> 
      </ion-item>

      <ion-item class="py-2" button (click)="openMeasurementModal()">
        <ion-label>
            {{ client.measurements && client.measurements.length > 0 ? 'View' : 'Add' }} Measurement
        </ion-label>
        @if(client.measurements && client.measurements.length > 0){
          <ion-note>{{ client.measurements.length }}</ion-note>
        }
      </ion-item>
    </ion-list>

    <div class="p-3">
      <app-primary-button
        [buttonText]="'Save Client'"
        [icon]="'save-outline'"
        (action)="submit()"
        [disabled]="!client.gender && !client.firstname && !client.lastname && !client.phoneNo"
      ></app-primary-button>
    </div>
  </form>
</ion-content>
