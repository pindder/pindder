<ion-content [fullscreen]="true">
    <!-- <ion-header>
        <ion-toolbar>
            <ion-title size="large">Add Client</ion-title>
        </ion-toolbar>
    </ion-header> -->

    <form #loginForm="ngForm" class="p-3">
        <ion-label>Personal Information</ion-label>

        <ion-input
        name="firstname"
        type="text"
        label="Firstname" 
        label-placement="floating" 
        fill="outline" 
        placeholder="Firstname"
        [(ngModel)]="profile.firstname"
        ></ion-input>

        <br />

        <ion-input 
        name="lastname"
        type="text" 
        label="Lastname" 
        labelPlacement="floating" 
        fill="outline" 
        [(ngModel)]="profile.lastname"
        ></ion-input>

        <br />

        <ion-input
        name="email"
        label="Email" 
        label-placement="floating" 
        fill="outline" 
        placeholder="Enter your email"
        [(ngModel)]="profile.email"
        ></ion-input>

        <br />

        <ion-input 
        name="phoneNo"
        type="text" 
        label="Phone Number" 
        labelPlacement="floating" 
        fill="outline" 
        [(ngModel)]="profile.phoneNo"
        ></ion-input>

        <br />

        <ion-footer>
        <ion-button 
        (click)="submit()"
        shape="round" 
        expand="block" 
        color="primary"
        >Continue</ion-button>
        </ion-footer>
    </form>
