<ion-item class="pt-4" lines="none">
  <ion-avatar aria-hidden="true" slot="start">
    @if(profile.profileImg){
      <img (click)="launchProfile()" [sizes]="" [src]="profile.profileImg" alt="Portrait of Connor Smith" />
    }@else{
      <img (click)="launchProfile()" [sizes]="" src="https://i.pravatar.cc/300?u=b" alt="Portrait of Connor Smith" />
    }
  </ion-avatar>
  <ion-label (click)="launchProfile()">
    <h2>{{ profile.firstname + ' ' + profile.lastname }} @if(profile.subscription){<ion-badge slot="start">{{ profile.subscription.plan.name }}</ion-badge>}</h2>
    <p>{{ profile.email }}</p>
  </ion-label>
  @if(!hideNotification){
    <ion-button color="light" size="medium" class="notification-bt  n" (click)="action.emit()">
      <ion-icon name="notifications" size="medium"></ion-icon>
      <ion-badge color="primary" class="notification-badge">{{ totalUnread() }}</ion-badge>
    </ion-button>
  } @else {
    <ion-button color="light" size="medium" (click)="action.emit()">
      <ion-icon name="pencil-outline" size="medium" slot="icon-only" (click)="action.emit()"></ion-icon>
    </ion-button>
  }
</ion-item>
