<ion-item class="pt-4" lines="none">
  <ion-avatar aria-hidden="true" slot="start">
    <img [sizes]="" src="https://i.pravatar.cc/300?u=b" alt="Portrait of Connor Smith" />
  </ion-avatar>
  <ion-label>
    <h2>{{ profile.firstname + ' ' + profile.lastname }} @if(profile.subscription){<ion-badge slot="start">{{ profile.subscription[0].plan.name }}</ion-badge>}</h2>
    <p>{{ profile.email }}</p>
  </ion-label>
  @if(!hideNotification){
    <ion-button color="light" size="large" (click)="action.emit()">
      <ion-icon name="notifications-outline" size="large" slot="icon-only"></ion-icon>
    </ion-button>
  } @else {
    <ion-button color="light" size="medium" (click)="action.emit()">
      <ion-icon name="pencil-outline" size="medium" slot="icon-only" (click)="action.emit()"></ion-icon>
    </ion-button>
  }
</ion-item>
