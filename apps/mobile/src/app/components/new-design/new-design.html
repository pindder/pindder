<ion-header>
    <ion-toolbar>
        <ion-title>New Style</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismissModal()">
                <ion-icon name="close-outline" color="primary" size="large"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
    <form #loginForm="ngForm" class="">
        <div class="image-grid p-3">
        <!-- Existing Uploaded Previews -->
            @for (imgUrl of uploadedImageUrls; track imgUrl; let i = $index) {
                <div class="image-card">
                    <img [src]="imgUrl" alt="Uploaded preview" />
                    <ion-button 
                    [id]="'present-alert' + i"
                    color="danger" 
                    size="small" 
                    fill="clear" 
                    class="delete-btn" 
                    >
                    <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                    </ion-button>
                    <ion-alert
                    [trigger]="'present-alert-' + i"
                    header="Delete Image"
                    message="Are you sure you want to remove this image?"
                    [buttons]="[
                        { text: 'Cancel', role: 'cancel' },
                        { 
                        text: 'Delete', 
                        role: 'confirm',
                        handler: () => removeImage( i)
                        }
                    ]"
                    ></ion-alert>
                </div>
            }

            <!-- Loading Spinner Card -->
            @if (isUploading) {
            <div class="image-card upload-card loading">
                <ion-spinner name="crescent" color="primary"></ion-spinner>
                <span class="upload-text">Uploading...</span>
            </div>
            }

            <!-- Add Images Trigger Card -->
            <div class="image-card upload-card" (click)="selectAndUploadMultipleImages()">
            <ion-icon name="camera-outline" class="camera-icon"></ion-icon>
            <span class="upload-text">Add Images</span>
            </div>
        </div>

        <ion-list lines="full">
            <ion-item>
                <ion-input
                name="name"
                type="text"
                label="Name"
                label-placement="floating" 
                fill="solid"
                placeholder="Name"
                [(ngModel)]="design.name"
                ></ion-input>
            </ion-item>
        

            <ion-item>
                <ion-textarea 
                name="description"
                label="Description" 
                label-placement="floating" 
                rows="5"
                fill="solid" 
                placeholder="Enter a description"
                [(ngModel)]="design.description"></ion-textarea>
            </ion-item>   
            
            <ion-item>
                <ion-select 
                name="design_type" 
                [(ngModel)]="design.type" 
                label="Design Type" 
                aria-label="Design Type" 
                placeholder="Select type" 
                label-placement="stacked">
                    @for(type of designTypes; track type){<ion-select-option [value]="type">{{ type }}</ion-select-option>}
                </ion-select>
            </ion-item>
        

            <ion-item>
                <ion-select 
                name="sizes" 
                [(ngModel)]="selectedSizes" 
                (ionChange)="onSizesChange($event)"
                label="Available Sizes" 
                aria-label="sizes" 
                placeholder="Select sizes" 
                label-placement="stacked"
                multiple="true"
                >
                    @for(size of sizes; track size){<ion-select-option [value]="size">{{ size }}</ion-select-option>}
                </ion-select>
            </ion-item>


            <ion-item>
                <ion-input
                name="amount"
                type="number"
                fill="solid"
                placeholder="Enter amount"
                label-placement="floating"
                [(ngModel)]="design.amount" 
                ></ion-input>
            </ion-item>
        </ion-list>

        <div class="p-3">
            <app-primary-button
            [buttonText]="'Save Style'"
            [icon]="'save-outline'"
            (action)="submit()"
            ></app-primary-button>
        </div>
    </form>
</ion-content>
