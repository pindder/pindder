<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button default-href="/app/clients"></ion-back-button>
        </ion-buttons>
        <ion-buttons slot="primary">
            <ion-button (click)="openActionSheet()">
                <ion-icon slot="icon-only" ios="ellipsis-horizontal" md="ellipsis-vertical"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title>Client Data</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content color="light" [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar  color="light">
            <ion-title size="large">Client Data</ion-title>
        </ion-toolbar>
    </ion-header>

    @if(client){
        <form id="editClientForm" #editClientForm="ngForm" (ngSubmit)="submit()" class="">
            <ion-list [inset]="true">
                <ion-item>
                    <ion-input 
                    name="firstname"
                    type="text"
                    [(ngModel)]="client.firstname" 
                    label="Firstname" 
                    labelPlacement="stacked"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input 
                    name="lastname"
                    type="text" 
                    label="Lastname"
                    labelPlacement="stacked"  
                    [(ngModel)]="client.lastname"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input
                    name="email"
                    type="email"
                    label="Email address"
                    labelPlacement="stacked"
                    [(ngModel)]="client.email"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input 
                    name="phoneNo"
                    label="Phone No"
                    type="tel" 
                    labelPlacement="stacked" 
                    [(ngModel)]="client.phoneNo"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-select 
                    name="gender" 
                    [(ngModel)]="client.gender" 
                    label="Gender" 
                    aria-label="Gender" 
                    placeholder="Select gender" 
                    labelPlacement="stacked"
                    >
                    @for (gender of genders; track gender) {
                        <ion-select-option [value]="gender">{{ gender }}</ion-select-option>
                    }
                    </ion-select> 
                </ion-item>
            </ion-list>
        </form>

        <ion-list [inset]="true">
            <ion-item button (click)="openMeasurementModal()">
                <ion-label>
                    View Measurement
                </ion-label>
            </ion-item>
        </ion-list>
        <ion-list [inset]="true">
            <ion-item button (click)="openOrdersModal()">
                <ion-label>
                    View Orders
                </ion-label>
            </ion-item>
        </ion-list>

        <!-- Action Buttons-->
        <div class="flex flex-col gap-2 p-3">
            <app-primary-button
            [buttonText]="'Save Changes'" 
            (click)="submit()" 
            icon="save-outline"
            ></app-primary-button>
        </div>
    }@else {
        <!-- Optional Loading Spinner -->
        <div class="ion-text-center ion-padding">
        <ion-spinner name="crescent"></ion-spinner>
        </div>
    }   

     <!-- Action Sheet -->
    <ion-action-sheet
        id="open-modal"
        [isOpen]="isActionSheetOpen()"
        header="Quick Actions"
        [buttons]="actionSheetButtons"
        (didDismiss)="isActionSheetOpen.set(false)">
    </ion-action-sheet>
</ion-content>
