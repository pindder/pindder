<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button default-href="/app/profile"></ion-back-button>
        </ion-buttons>
        <ion-title>Edit Profile</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">Edit Profile</ion-title>
        </ion-toolbar>
    </ion-header>

    @if(profile()){
        <div class="flex justify-center items-center my-5">
            @if(profile().profileImg){
            <ion-avatar aria-hidden="true" slot="start">
                <img [sizes]="" [src]="profile().profileImg" alt="profile-pic" />
            </ion-avatar>}
            @else{
                <div></div>
            }
        </div>
        <form #editProfileForm="ngForm">
            <ion-list lines="full">
                <ion-item>
                    <ion-input 
                    name="firstname"
                    type="text"
                    [(ngModel)]="profile().firstname" 
                    label="Firstname" 
                    label-placement="stacked"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input 
                    name="lastname"
                    type="text" 
                    label="Lastname"
                    label-placement="stacked"  
                    [(ngModel)]="profile().lastname"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input
                    name="email"
                    type="email"
                    label="Email address"
                    label-placement="stacked"
                    [(ngModel)]="profile().email"
                    ></ion-input>
                </ion-item>

                <ion-item fill="outline" class="custom-input phone-container-item">
                    <div class="flex flex-col">
                        <ion-text class="text-xs pt-2" [color]="'dark'" slot="start">Phone No</ion-text>
                        <div class="phone-input-wrapper">
                            <!-- Country Code Selector -->
                            <ion-select 
                            [(ngModel)]="profile().countryCode" 
                            name="countryCode" 
                            [interfaceOptions]="customModalOptions" 
                            interface="modal" 
                            [toggleIcon]="'chevron-down-outline'"
                            class="country-code-select"
                            aria-label="Country Code">
                                @for(c of countries; track c.name) {
                                    <ion-select-option [value]="c.code">
                                        {{ c.flag }} {{ c.code }}
                                    </ion-select-option>
                                }
                            </ion-select>

                            <!-- Phone Digits Input -->
                            <ion-input 
                            label-placement="stacked" 
                            type="tel" 
                            [(ngModel)]="profile().tel" 
                            name="tel"
                            placeholder="800 000 0000" 
                            class="phone-digits-input"
                            required>
                            </ion-input>
                        </div>
                    </div>
                </ion-item>

                <ion-item>
                    <ion-input 
                    name="username"
                    type="text"
                    [(ngModel)]="profile().username" 
                    label="Username" 
                    label-placement="stacked"
                    ></ion-input>
                </ion-item>
            </ion-list>

            <!-- Action Button-->
            <div class="p-3">
                <app-primary-button
                [buttonText]="'Save Profile'"
                [icon]="'save-outline'"
                (action)="submit()"                
                ></app-primary-button>
            </div>
        </form>
    }
</ion-content>
