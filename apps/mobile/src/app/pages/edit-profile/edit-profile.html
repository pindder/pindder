<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button default-href="/app/profile"></ion-back-button>
        </ion-buttons>
        <ion-title>Edit Profile</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">Edit Profile</ion-title>
        </ion-toolbar>
    </ion-header>

    @if(profile){
        <form #editProfileForm="ngForm" class="my-5">
            <ion-list lines="full">
                <ion-item>
                    <ion-input 
                    name="firstname"
                    type="text"
                    [(ngModel)]="profile.firstname" 
                    label="Firstname" 
                    label-placement="stacked"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input 
                    name="lastname"
                    type="text" 
                    label="Lastname"
                    label-placement="stacked"  
                    [(ngModel)]="profile.lastname"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input
                    name="email"
                    type="email"
                    label="Email address"
                    label-placement="stacked"
                    [(ngModel)]="profile.email"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input 
                    name="phoneNo"
                    label="Phone No"
                    type="tel" 
                    label-placement="stacked" 
                    [(ngModel)]="profile.phoneNo"
                    ></ion-input>
                </ion-item>

                <ion-item>
                    <ion-input 
                    name="username"
                    type="text"
                    [(ngModel)]="profile.username" 
                    label="Username" 
                    label-placement="stacked"
                    ></ion-input>
                </ion-item>
            </ion-list>

            <!-- Action Button-->
            <div class="p-3">
                <app-primary-button
                [buttonText]="'Save Profile'"
                [icon]="'save-outline'"
                (action)="submit()"                
                ></app-primary-button>
            </div>
        </form>
    }
</ion-content>
