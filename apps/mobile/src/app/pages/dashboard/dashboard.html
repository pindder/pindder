<!-- floating action button -->
<ion-fab slot="fixed">
  <ion-fab-button cdkDrag class="draggable-fab" (click)="isActionSheetOpen.set(true)">
    <ion-icon name="add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content [fullscreen]="true">
  @if(profile){
    <!-- Profile Header-->
    <app-profile-card 
    [profile]="profile" 
    [hideNotification]="false"
    (action)="openNotificationsModal()"
    ></app-profile-card>

    <!-- Referral Block-->
    <app-referral-block [profile]="profile" (action)="copyToClipboard()"></app-referral-block>
  }
  
  <!-- Data Cards -->
  <ion-grid>
    <ion-row class="">
      @for(tile of tiles; track $index){
        <ion-col class="p-2" sizeLg="3" sizeMd="3" sizeXs="6">
          <app-data-tile [data]="tile" (action)="gotoOrder($event)"></app-data-tile>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- Recent Notifications-->
  <ion-list lines="none">
    <ion-list-header class="px-0">
      <ion-label>Recent Notifications</ion-label>
      <ion-button fill="clear" (click)="clearRecentNotifications()">Clear all</ion-button>
    </ion-list-header>

    @for(notification of notifications; track $index){
      <app-notification-tile [notification]="notification"></app-notification-tile>
    } @empty { 
      <app-empty-state
      [hideButton]="true"
      [icon]="'notifications-off-outline'"
      [title]="'No data'"
      ></app-empty-state>
    }
  </ion-list>

  <!-- Action Sheet -->
  <ion-action-sheet
    id="open-modal"
    [isOpen]="isActionSheetOpen()"
    header="Create Actions"
    [buttons]="actionSheetButtons"
    (didDismiss)="isActionSheetOpen.set(false)">
  </ion-action-sheet>
</ion-content>
