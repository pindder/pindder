<!-- floating action button -->
<ion-fab slot="fixed">
  <ion-fab-button cdkDrag class="draggable-fab" (click)="isActionSheetOpen.set(true)">
    <ion-icon name="add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content [fullscreen]="true">
  <!-- Profile Header-->
  <ion-item lines="none">
    <ion-avatar aria-hidden="true" slot="start">
      <img [sizes]="" src="https://i.pravatar.cc/300?u=b" alt="Portrait of Connor Smith" />
    </ion-avatar>
    <ion-label>
      <h2>Bolade Lagundoye</h2>
      <p>boladelag@gmail.com</p>
    </ion-label>
    <ion-icon name="notifications-outline" slot="end"></ion-icon>
  </ion-item>

  <!-- <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Dashboard</ion-title>
    </ion-toolbar>
  </ion-header> -->

  <!-- Referral Block-->
  <ion-card class="border-primary">
    <app-referral-block></app-referral-block>
  </ion-card>

  <!-- Data Cards -->
  <ion-grid [fixed]="true">
    <ion-row>
      @for(tile of tiles; track $index){
        <ion-col sizeMd="3" sizeXs="6">
          <app-data-tile [data]="tile"></app-data-tile>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <ion-list>
    <ion-list-header>
      <ion-label>Recent Notifications</ion-label>
      <ion-button fill="clear">Clear all</ion-button>
    </ion-list-header>

    @for(notification of notifications; track $index){
      <app-notification-tile [notification]="notification"></app-notification-tile>
    }
  </ion-list>

  <!-- <ion-item lines="none">
    <ion-label>Recent Notifications</ion-label>
    <ion-button fill="clear">Clear all</ion-button>
  </ion-item>

  @for(notification of notifications; track $index){
    <app-notification-tile [data]="notification"></app-notification-tile>
  } -->
</ion-content>

<!-- Action Sheet -->
<ion-action-sheet
  [isOpen]="isActionSheetOpen()"
  header="Create Actions"
  [buttons]="actionSheetButtons"
  (didDismiss)="isActionSheetOpen.set(false)">
</ion-action-sheet>

<!-- Modal -->
<ion-modal #modal
  [isOpen]="isModalOpen()"
  (didDismiss)="isModalOpen.set(false)"
>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Modal</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="modal.dismiss()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <ion-list>
        <ion-item>
          <ion-avatar slot="start">
            <img src="https://i.pravatar.cc/300?u=b" alt="Portrait of Connor Smith" />
          </ion-avatar>
          <ion-label>
            <h2>Connor Smith</h2>
            <p>Sales Rep</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-avatar slot="start">
            <img src="https://i.pravatar.cc/300?u=a" alt="Portrait of Daniel Smith" />
          </ion-avatar>
          <ion-label>
            <h2>Daniel Smith</h2>
            <p>Product Designer</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-avatar slot="start">
            <img src="https://i.pravatar.cc/300?u=d" alt="Portrait of Greg Smith" />
          </ion-avatar>
          <ion-label>
            <h2>Greg Smith</h2>
            <p>Director of Operations</p>
          </ion-label>
        </ion-item>
        <ion-item>
          <ion-avatar slot="start">
            <img src="https://i.pravatar.cc/300?u=l" alt="Portrait of Zoey Smith" />
          </ion-avatar>
          <ion-label>
            <h2>Zoey Smith</h2>
            <p>CEO</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
