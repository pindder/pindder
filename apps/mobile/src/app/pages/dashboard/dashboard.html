<!-- floating action button -->
<ion-fab slot="fixed">
  <ion-fab-button cdkDrag class="draggable-fab" (click)="isActionSheetOpen.set(true)">
    <ion-icon name="add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content [scrollY]="false" [fullscreen]="true">
  <div class="scroll-container-wrapper">
  @if(profile){
    <!-- Profile Header-->
    <app-profile-card 
    [profile]="profile" 
    [hideNotification]="false"
    (action)="openNotifications()"
    ></app-profile-card>

    <!-- Earnings -->
    <app-earnings-card [profile]="profile" (withdraw)="gotoPayout()" (earn)="gotoEarn()"></app-earnings-card>

    <!-- Referral Block-->
    <app-referral-block [profile]="profile" (action)="copyToClipboard()"></app-referral-block>
  }

  <!-- Quick Access-->
  <div class="mx-3 mt-2">
    <div class="">
      <ion-label>
        <h3>Quick Access</h3>
      </ion-label>
    </div>
  
      <div class="flex flex-nowrap gap-2 pt-2 no-scrollbar overflow-auto">
      @for(tile of tiles; track $index){
        <!-- <ion-col class="p-2" sizeLg="3" sizeMd="3" sizeXs="6"> -->
          <app-data-tile [data]="tile" (action)="gotoOrder($event)"></app-data-tile>
        <!-- </ion-col> -->
      }
      </div>
  </div>

  <!-- Recent Notifications-->
  <div class="scrollable-body">
    <ion-list lines="none">
      <ion-list-header>
        <ion-note>Recent Activities</ion-note>
        <!-- <ion-buttons>
          <ion-button fill="light" (click)="clearRecentNotifications()">
            <ion-icon name="close-circle" slot="icon-only"></ion-icon>
          </ion-button>
        </ion-buttons> -->
      </ion-list-header>

      @for(notification of notifications; track $index){
        <app-notification-tile [notification]="notification"></app-notification-tile>
      } @empty { 
        <app-empty-state
        [hideButton]="true"
        [icon]="'notifications-off-outline'"
        [title]="'No Activity'"
        ></app-empty-state>
      }
    </ion-list>
  </div>

  <!-- Action Sheet -->
  <ion-action-sheet
    id="open-modal"
    [isOpen]="isActionSheetOpen()"
    header="Create Actions"
    [buttons]="actionSheetButtons"
    (didDismiss)="isActionSheetOpen.set(false)">
  </ion-action-sheet>
</div>
</ion-content>
