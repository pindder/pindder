<!-- floating action button -->
<ion-fab slot="fixed">
  <ion-fab-button cdkDrag class="draggable-fab" (click)="isActionSheetOpen.set(true)">
    <ion-icon name="add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content [fullscreen]="true">
  @if(profile){
    <!-- Profile Header-->
    <app-profile-card 
    [profile]="profile" 
    [hideNotification]="false"
    (action)="openNotifications()"
    ></app-profile-card>

    <!-- Earnings -->
    <app-earnings-card [profile]="profile" (withdraw)="modal.present()" (earn)="gotoEarn()"></app-earnings-card>

    <!-- Referral Block-->
    <app-referral-block [profile]="profile" (action)="copyToClipboard()" (share)="shareLink()"></app-referral-block>
  }

  <!-- Quick Access-->
  <div class="mx-3 mt-3">
    <div class="">
      <ion-label>
        <h2>Quick Access</h2>
      </ion-label>
    </div>
  
      <div class="flex flex-nowrap gap-2 pt-2 no-scrollbar overflow-auto">
      @for(tile of tiles; track $index){
        <!-- <ion-col class="p-2" sizeLg="3" sizeMd="3" sizeXs="6"> -->
          <app-data-tile [data]="tile" (action)="gotoOrder($event)"></app-data-tile>
        <!-- </ion-col> -->
      }
      </div>
  </div>

  <!-- Recent Notifications-->
  <div class="mx-3 mt-3">
    <div class="">
      <ion-label>
        <h2>Recent Activities</h2>
      </ion-label>
    </div>
  </div>
  <ion-list lines="none">
    @for(notification of notifications; track $index){
      <app-notification-tile [notification]="notification"></app-notification-tile>
    } @empty { 
      <app-empty-state
      [hideButton]="true"
      [icon]="'notifications-off-outline'"
      [title]="'No Activity'"
      ></app-empty-state>
    }
  </ion-list>

  <!-- Action Sheet -->
  <ion-action-sheet
    id="open-modal"
    [isOpen]="isActionSheetOpen()"
    header="Create Actions"
    [buttons]="actionSheetButtons"
    (didDismiss)="isActionSheetOpen.set(false)">
  </ion-action-sheet>

  <!-- Withdraw Modal -->
  <ion-modal 
  #modal 
  [initialBreakpoint]="0.3" 
  [breakpoints]="[0.3, 0.5]"
  (didDismiss)="dismissModal()"
  >
      <ng-template>
          <ion-content color="light">
            <app-payout></app-payout>
          </ion-content>
      </ng-template>
  </ion-modal>
</ion-content>
