<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button default-href="app/profile"></ion-back-button>
        </ion-buttons>
        <ion-title>Premium</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content color="light" [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar color="light">
        <ion-title size="large">Premium</ion-title>
        </ion-toolbar>
    </ion-header>

    <div class="packages-scroll-container">
      @for(pkg of packages; track pkg._id){
        <lib-pricing-card 
        [plan]="pkg"
        [isNative]="isNative"
        [isAuthenticated]="isAuthenticated"
        (initializeSubscription)="initSub($event)"
        ></lib-pricing-card>
      }
    </div>
</ion-content>
