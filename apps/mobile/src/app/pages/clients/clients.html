<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>Clients</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">clients</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Search bar-->
  <ion-searchbar 
    placeholder="Search by name, email, phone..." 
    [debounce]="0" 
    (ionInput)="onSearchInput($event)"
    (ionChange)="onSearchInput($event)"
  ></ion-searchbar>

  <!-- New Client Button-->
  <div class="px-2">
    <app-primary-button
    [buttonText]="'New Client'" 
    (click)="openNewClientModal()" 
    icon="add-outline"
    ></app-primary-button>
  </div>
  
  <!-- Clients list-->
  @if(clients$ | async; as clients) {
    <ion-list class="flex flex-col gap-2" inset="true">
      @for(cl of clients; track $index){
        <app-list-card 
        [dataType]="dataTypes.CLIENT" 
        [client]="cl" 
        (updateList)="updateClientsList(cl)"></app-list-card>
      }
    </ion-list>
  }
</ion-content>
