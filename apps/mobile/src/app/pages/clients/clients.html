<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>Clients</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">clients</ion-title>
    </ion-toolbar>
  </ion-header>

  
  @if(clients && clients.length > 0) {
    <ion-list class="flex flex-col gap-3" inset="true">
      @for(cl of clients; track $index){
        <app-list-card [dataType]="dataTypes.CLIENT" [client]="cl"></app-list-card>
      }
    </ion-list>
  }
</ion-content>
