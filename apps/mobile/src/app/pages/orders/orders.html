<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>Orders</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Orders</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-segment [scrollable]="true" value="call">
    <ion-segment-button value="call" contentId="first">
      <ion-label>All</ion-label>
    </ion-segment-button>
    <ion-segment-button value="globe" contentId="second">
      <ion-label>Pending</ion-label>
    </ion-segment-button>
    <ion-segment-button value="basket" contentId="third">
      <ion-label>Ongoing</ion-label>
    </ion-segment-button>
    <ion-segment-button value="barbell" contentId="fourth">
      <ion-label>Completed</ion-label>
    </ion-segment-button>
  </ion-segment>
  <ion-segment-view>
    <ion-segment-content class="p-3" id="first">
      <app-empty-state></app-empty-state>
    </ion-segment-content>
    <ion-segment-content class="p-3" id="second">
      <app-empty-state></app-empty-state>
    </ion-segment-content>
    <ion-segment-content class="p-3" id="third">
      <app-empty-state></app-empty-state>
    </ion-segment-content>
    <ion-segment-content class="p-3" id="fourth">
      <app-empty-state></app-empty-state>
    </ion-segment-content>
  </ion-segment-view>
</ion-content>
