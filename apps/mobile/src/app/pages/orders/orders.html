<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>Orders</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Orders</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-segment [scrollable]="true" value="call">
    <ion-segment-button value="call" contentId="first">
      <ion-label>All</ion-label>
    </ion-segment-button>
    <ion-segment-button value="globe" contentId="second">
      <ion-label>Pending</ion-label>
    </ion-segment-button>
    <ion-segment-button value="basket" contentId="third">
      <ion-label>Ongoing</ion-label>
    </ion-segment-button>
    <ion-segment-button value="barbell" contentId="fourth">
      <ion-label>Completed</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-segment-view>
    <ion-segment-content class="p-3" id="first">
      <app-empty-state [parentComponent]="dataTypes.ORDER" (action)="openNewOrderModal()"></app-empty-state>
    </ion-segment-content>
    <ion-segment-content class="p-3" id="second">
      <app-empty-state></app-empty-state>
    </ion-segment-content>
    <ion-segment-content class="p-3" id="third">
      <app-empty-state></app-empty-state>
    </ion-segment-content>
    <ion-segment-content class="p-3" id="fourth">
      <app-empty-state></app-empty-state>
    </ion-segment-content>
  </ion-segment-view>

  <ion-modal #modal [presentingElement]="presentingElement">
    <ng-template>
      <!-- <ion-header>
          <ion-toolbar>
              <ion-title>New Order</ion-title>
              <ion-buttons slot="end">
                  <ion-button (click)="modal.dismiss()">
                      <ion-icon name="close-outline" color="primary" size="large"></ion-icon>
                  </ion-button>
              </ion-buttons>
          </ion-toolbar>
      </ion-header> -->
      <ion-content>
          <!-- <div class="p-3">
              <ion-label class="p-1">Take your client's measurment data effortlessly.</ion-label>
          </div> -->
          <app-new-order></app-new-order>
      </ion-content>
    </ng-template>
  </ion-modal>
</ion-content>
