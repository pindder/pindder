<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>Styles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">styles</ion-title>
    </ion-toolbar>
  </ion-header>

  @if(designs.length < 1) {
    <app-empty-state [imgPath]="'/images/add-to-cart.png'"></app-empty-state>
  } @else {
    <ion-grid>
      <ion-row class="p-0">
      @for(design of designs; track design._id){
        <ion-col class="p-0" sizeLg="3" sizeMd="3" sizeXs="6">
          <app-list-card [design]="design" [dataType]="dataTypes.DESIGN"></app-list-card>
        </ion-col>
      }
      </ion-row>
    </ion-grid>
  }
</ion-content>
