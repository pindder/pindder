<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">profile</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-profile-card [profile]="profile" (action)="openProfileEdit()"></app-profile-card>

  <!-- Settings Section List-->
  <ion-list [inset]="true">
    <ion-list-header class="">
      <ion-note>Settings</ion-note>
    </ion-list-header>
    <ion-item [routerLink]="['bank-details']">
      <ion-icon name="business-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>Account Details</ion-label>
    </ion-item>
    <ion-item [routerLink]="['premium']">
      <ion-icon name="cash-outline" slot="start"></ion-icon>
      <ion-label>Pindder Premium</ion-label>
    </ion-item>
    <ion-item [routerLink]="['referrals']">
      <ion-icon name="repeat-outline" slot="start"></ion-icon>
      <ion-label>Referrals</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-toggle>
        Notifications
      </ion-toggle>
    </ion-item>
  </ion-list>

  <!-- Support Section List-->
  <ion-list [inset]="true">
    <ion-list-header class="">
      <ion-note>Support</ion-note>
    </ion-list-header>
    <ion-item [routerLink]="['help']">
      <ion-icon name="help-buoy-outline" slot="start"></ion-icon>
      <ion-label>Help</ion-label>
    </ion-item>
    <ion-item [routerLink]="['contact']">
      <ion-icon name="call-outline" slot="start"></ion-icon>
      <ion-label>Contact us</ion-label>
    </ion-item>
  </ion-list>

  <!-- Legal Section List-->
  <ion-list [inset]="true">
    <ion-list-header class="">
      <ion-note>Legal</ion-note>
    </ion-list-header>
    <ion-item>
      <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
      <ion-label>Usage Policy</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="document-text-outline" slot="start"></ion-icon>
      <ion-label>Terms of use</ion-label>
    </ion-item>
  </ion-list>

  <!-- Logout-->
  <ion-list [inset]="true">
    <ion-item [button]="true" (click)="logout()">
      <ion-icon color="danger" name="log-out-outline" slot="start"></ion-icon>
      <ion-label color="danger">Logout</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
