<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">profile</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-profile-card [profile]="profile" (action)="openProfileEdit()"></app-profile-card>

  <!-- Settings Section List-->
  <div class="px-4 pt-1">
    <h3 class="text-sm font-bold uppercase text-gray-500 tracking-wider m-0">
      Account Settings
    </h3>
  </div>
  <ion-list [inset]="true">
    <!-- <ion-list-header class="">
      <ion-note>Settings</ion-note>
    </ion-list-header> -->
    <ion-item [routerLink]="['brand']">
      <ion-icon name="business-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>Business Details</ion-label>
    </ion-item>
    <ion-item [routerLink]="['bank-details']">
      <ion-icon name="card-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>Account Details</ion-label>
    </ion-item>
    <ion-item [routerLink]="['premium']">
      <ion-icon name="albums-outline" slot="start"></ion-icon>
      <ion-label>Pindder Premium</ion-label>
    </ion-item>
    <!-- <ion-item [routerLink]="['referrals']">
      <ion-icon name="repeat-outline" slot="start"></ion-icon>
      <ion-label>Referrals</ion-label>
    </ion-item> -->
    <ion-item>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-toggle>
        Notifications
      </ion-toggle>
    </ion-item>
  </ion-list>

  <!-- Support Section List-->
   <div class="px-4 pt-1">
    <h3 class="text-sm font-bold uppercase text-gray-500 tracking-wider m-0">
      Support
    </h3>
  </div>
  <ion-list [inset]="true">
    <!-- <ion-list-header class="">
      <ion-note>Support</ion-note>
    </ion-list-header> -->
    <ion-item href="https://pindder.com/help" [detailIcon]="'open-outline'">
      <ion-icon name="help-buoy-outline" slot="start"></ion-icon>
      <ion-label>Help Center</ion-label>
    </ion-item>
    <ion-item [routerLink]="['contact']">
      <ion-icon name="headset-outline" slot="start"></ion-icon>
      <ion-label>Get in touch</ion-label>
    </ion-item>
  </ion-list>

  <!-- Legal Section List-->
   <div class="px-4 pt-1">
    <h3 class="text-sm font-bold uppercase text-gray-500 tracking-wider m-0">
      Legal
    </h3>
  </div>
  <ion-list [inset]="true">
    <!-- <ion-list-header class="">
      <ion-note>Legal</ion-note>
    </ion-list-header> -->
    <ion-item href="https://pindder.com/privacy-policy#usage" [detailIcon]="'open-outline'">
      <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
      <ion-label>Usage Policy</ion-label>
    </ion-item>
    <ion-item href="https://pindder.com/terms-and-condition" [detailIcon]="'open-outline'">
      <ion-icon name="document-text-outline" slot="start"></ion-icon>
      <ion-label>Terms of use</ion-label>
    </ion-item>
  </ion-list>

  <!-- Logout-->
  <ion-list [inset]="true">
    <ion-item [button]="true" (click)="presentLogoutConfirmationAlert()">
      <ion-icon color="danger" name="log-out-outline" slot="start"></ion-icon>
      <ion-label color="danger">Logout</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
