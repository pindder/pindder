<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">profile</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-profile-card></app-profile-card>

  <!-- Settings Section List-->
  <ion-list [inset]="true">
    <ion-list-header class="l-pad-0">
      <ion-label>Settings</ion-label>
    </ion-list-header>
    <ion-item [routerLink]="['account-info']">
      <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>Account Details</ion-label>
    </ion-item>
    <ion-item [routerLink]="['subscription']">
      <ion-icon name="cash-outline" slot="start"></ion-icon>
      <ion-label>Pindder Premium</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="key-outline" slot="start"></ion-icon>
      <ion-label>Login & Security</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-toggle>
        Notifications
      </ion-toggle>
    </ion-item>
  </ion-list>

  <!-- Support Section List-->
  <ion-list [inset]="true">
    <ion-list-header class="l-pad-0">
      <ion-label>Support</ion-label>
    </ion-list-header>
    <ion-item>
      <ion-icon name="help-buoy-outline" slot="start"></ion-icon>
      <ion-label>Help</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="call-outline" slot="start"></ion-icon>
      <ion-label>Contact us</ion-label>
    </ion-item>
  </ion-list>

  <!-- Legal Section List-->
  <ion-list [inset]="true">
    <ion-list-header class="l-pad-0">
      <ion-label>Legal</ion-label>
    </ion-list-header>
    <ion-item>
      <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
      <ion-label>Usage Policy</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="document-text-outline" slot="start"></ion-icon>
      <ion-label>Terms of use</ion-label>
    </ion-item>
  </ion-list>

  <!-- Logout-->
  <ion-list [inset]="true">
    <ion-item [button]="true" (click)="logout()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      <ion-label>Logout</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
