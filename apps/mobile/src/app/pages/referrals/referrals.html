<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button default-href="#"></ion-back-button>
        </ion-buttons>
        <ion-title>Referrals</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content color="light" [fullscreen]="true">
    <ion-header collapse="condense">
        <ion-toolbar color="light">
        <ion-title size="large">Referrals</ion-title>
        </ion-toolbar>
    </ion-header>

    <ion-card class="">
        <ion-card-content>
            <div class="flex flex-col gap-3">
                <img src="images/trophy.gif" alt="" />
                <ion-label>
                    <h2><ion-text color="primary">Invite Friends & Earn Rewards</ion-text></h2>
                </ion-label>
                <p>Share your referral code and earn amazing bonuses for every successful referral.</p>
            </div>
        </ion-card-content>
    </ion-card>

    <ion-grid [fixed]="true" class="p-0 m-0">
        <ion-row>
            <ion-col>
                <ion-card class="tight-card">
                    <ion-card-content>
                        <div class="flex justify-between items-center">
                            <ion-icon size="large" name="people-outline" color="primary" slot="icon-only"></ion-icon>
                            <ion-label>
                                <h2>Referrals</h2>
                                <h3>0</h3>
                            </ion-label>
                        </div>
                    </ion-card-content>
                </ion-card>
            </ion-col>
            <ion-col>
                <ion-card class="tight-card">
                    <ion-card-content>
                        <div class="flex justify-between items-center">
                            <ion-icon size="large" name="wallet-outline" color="primary" slot="icon-only"></ion-icon>
                            <ion-label>
                                <h2>Earnings</h2>
                                <h3>0</h3>
                            </ion-label>
                        </div>
                    </ion-card-content>
                </ion-card>
            </ion-col>
        </ion-row>
    </ion-grid>

    <ion-list [inset]="true">
        <ion-list-header>
            <ion-label>Your referral code</ion-label>
        </ion-list-header>
        <ion-item lines="none" button>
            <ion-label>
                {{ profile ? profile.referralCode : '' }}
            </ion-label>
            <ion-note>Copy</ion-note>
        </ion-item>
    </ion-list>

    <div class="flex flex-col gap-2 m-3">
        <app-primary-button
        [buttonText]="'Redeem Rewards'"
        [fill]="'outline'"
        (action)="modal.present()"
        ></app-primary-button>

        <app-primary-button
        (action)="shareLink()"
        [buttonText]="'Invite Friends & Earn'"
        ></app-primary-button>
    </div>

    <!-- Modal sheet for quantity and color selection-->
    <ion-modal 
    #modal 
    [initialBreakpoint]="0.3" 
    [breakpoints]="[0.3, 0.5]"
    (didDismiss)="dismissModal()"
    >
        <ng-template>
            <ion-content color="light">
                <app-payout></app-payout>
            </ion-content>
        </ng-template>
    </ion-modal>
</ion-content>
