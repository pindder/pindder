<!-- Form Box Wrapper -->
<div class="w-full max-w-md mx-auto my-auto py-8">

<div class="space-y-6">
    <div>
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Welcome back</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Please enter your credentials to access your studio workspace.</p>
    </div>

    <!-- Alert Feedback Message -->
    @if (errorMessage()) {
        <div class="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400 text-xs flex items-center space-x-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage() }}</span>
        </div>
    }

    <form (submit)="handleLogin($event)" class="space-y-4">
        <!-- Email Field -->
        <div>
        <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email address</label>
        <div class="relative">
            <input 
            type="email" 
            [(ngModel)]="loginData.email" 
            name="loginEmail"
            required
            placeholder="name@example.com" 
            class="w-full px-3.5 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 text-slate-900 dark:text-white placeholder-slate-400 transition-all"
            />
        </div>
        </div>

        <!-- Password Field -->
        <div>
        <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-medium text-slate-700 dark:text-slate-300">Password</label>
            <a href="#" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">Forgot password?</a>
        </div>
        <div class="relative">
            <input 
            [type]="showPassword() ? 'text' : 'password'" 
            [(ngModel)]="loginData.password" 
            name="loginPassword"
            required
            placeholder="••••••••" 
            class="w-full pl-3.5 pr-10 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 text-slate-900 dark:text-white placeholder-slate-400 transition-all"
            />
            <button 
            type="button" 
            (click)="togglePasswordVisibility()" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
            >
            @if (showPassword()) {
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.018 10.018 0 013.682-.763c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m-1.776 1.285l-1.423-1.423m-2.18-2.18l-1.423-1.423m-2.18-2.18l-1.423-1.423m-2.18-2.18L3 3l18 18"/></svg>
            } @else {
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            }
            </button>
        </div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="flex items-center space-x-2 pt-1">
        <input 
            type="checkbox" 
            id="remember" 
            [(ngModel)]="loginData.rememberMe"
            name="rememberMe"
            class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 dark:bg-slate-900 dark:border-slate-800"
        />
        <label for="remember" class="text-xs text-slate-600 dark:text-slate-400 select-none">Remember this device for 30 days</label>
        </div>

        <!-- Submit Button -->
        <button 
        type="submit" 
        [disabled]="isLoading()"
        class="w-full py-2.5 px-4 rounded-xl bg-pindder-primary hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm shadow-md shadow-indigo-500/20 transition-all flex items-center justify-center space-x-2 disabled:opacity-50"
        >
        @if (isLoading()) {
            <svg class="animate-spin w-4 h-4 text-white" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Signing in...</span>
        } @else {
            <span>Sign In</span>
        }
        </button>
    </form>
