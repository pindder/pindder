<div [class.dark]="isDarkMode()" class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">
      
      <!-- Main Container -->
      <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar Backdrop (Mobile) -->
        @if (isMobileMenuOpen()) {
          <div 
            (click)="toggleMobileMenu()" 
            class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden transition-opacity"
          ></div>
        }

        <app-sidebar 
        [isMobileMenuOpen]="isMobileMenuOpen"
        [isDarkMode]="isDarkMode"
        [isNotificationsOpen]="isNotificationsOpen"
        (toggleMobileMenu)="toggleMobileMenu()"
        ></app-sidebar>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-scroll">
          
          <!-- Topbar -->
          <header class="sticky top-0 h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700/60 px-4 lg:px-6 flex items-center justify-between z-10 shrink-0">
            <!-- Left Header Controls -->
            <div class="flex items-center space-x-3">
              <!-- Mobile menu button -->
              <button 
                (click)="toggleMobileMenu()" 
                class="lg:hidden p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/50"
              >
                <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>

              <!-- Global Search -->
              <div class="relative hidden sm:block w-64 lg:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                </span>
                <input 
                  type="text" 
                  placeholder="Search orders, clients, designs..." 
                  class="w-full pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-700/50 border-0 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 text-slate-800 dark:text-slate-100 placeholder-slate-400"
                />
              </div>
            </div>

            <!-- Right Header Controls -->
            <div class="flex items-center space-x-3">
              
              <!-- Dark/Light Theme Toggle -->
              <button 
                (click)="toggleTheme()" 
                class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors"
                [title]="isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
              >
                @if (isDarkMode()) {
                  <svg class="w-5 h-5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                } @else {
                  <svg class="w-5 h-5 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                  </svg>
                }
              </button>

              <!-- Notifications Dropdown Trigger -->
              <div class="relative">
                <button 
                  (click)="toggleNotifications()"
                  class="p-2 rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors relative"
                >
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                  </svg>
                  <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-600 rounded-full ring-2 ring-white dark:ring-slate-800"></span>
                </button>

                <!-- Notifications Popover -->
                @if (isNotificationsOpen()) {
                  <div class="absolute right-0 mt-2 w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700/60 py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-150">
                    <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                      <span class="font-semibold text-sm">Notifications</span>
                      <span class="text-xs bg-indigo-100 dark:bg-indigo-900/60 text-indigo-600 dark:text-indigo-300 font-medium px-2 py-0.5 rounded-full">3 New</span>
                    </div>
                    <div class="divide-y divide-slate-100 dark:divide-slate-700/40 max-h-64 overflow-y-auto">
                      <div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors cursor-pointer">
                        <p class="text-xs font-semibold text-indigo-600 dark:text-indigo-400">New Order Received</p>
                        <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">Order #ORD-9821 placed by Client John Doe.</p>
                        <span class="text-[10px] text-slate-400 mt-1 block">5 mins ago</span>
                      </div>
                      <div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors cursor-pointer">
                        <p class="text-xs font-semibold text-emerald-600 dark:text-emerald-400">Payment Confirmed</p>
                        <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">Payment of $450 received for Design #DS-203.</p>
                        <span class="text-[10px] text-slate-400 mt-1 block">1 hour ago</span>
                      </div>
                    </div>
                  </div>
                }
              </div>
            </div>
          </header>

          <!-- Main Scrollable Body Content -->
          <main class="flex-1 overflow-y-auto p-4 lg:p-6">
            <router-outlet></router-outlet>
          </main>
        </div>
    </div>
</div>
