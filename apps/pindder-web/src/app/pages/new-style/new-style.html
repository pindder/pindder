<ion-header>
    <ion-toolbar>
        <ion-title class="px-4">{{ isAuthenticated ? 'New Style' : 'Upload Custom Style'}}</ion-title>
        <ion-buttons slot="end">
            <ion-button (click)="dismissModal()">
                <ion-icon name="close-outline" color="primary" size="large"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<lib-style-upload
[design]="design"
[colors]="availableColors"
[user]="newUser"
[isUploading]="isUploading"
[uploadedImageUrls]="uploadedImageUrls"
(launchSpecification)="openSpecificationModal()"
(submitStyle)="submit()"
(uploadImages)="selectAndUploadMultipleImages($event)"
></lib-style-upload>
