<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button default-href="#"></ion-back-button>
    </ion-buttons>
    <ion-title>Orders</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Orders</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="container">
  @if(orders$ | async; as orders) {
    <!-- Searchbar-->
    <ion-searchbar 
    placeholder="Search orders..." 
    [debounce]="0" 
    (ionInput)="onSearchInput($event)"
    (ionChange)="onSearchInput($event)"
    ></ion-searchbar>

    <!-- New Order Button-->
    @if(orders.length > 0){
    <div class="px-2">
      <lib-button
      [buttonText]="'New Order'" 
      (action)="openNewOrderModal()" 
      icon="add-outline"
      ></lib-button>
    </div>
    }
    
    <div class="container">
    @for (order of orders; track order._id) {
      <lib-items-list 
      [order]="order" 
      [dataType]="dataTypes.ORDER"
      (action)="navigate($event)"
      > 
      </lib-items-list>
    }
    </div>

    @if(orders.length === 0) {     
      <lib-empty-state 
      [imgPath]="'/images/add-to-cart.png'"
      [title]="'No Order Found'" 
      [desc]="'click the button to create an order.'" 
      [buttonText]="'New Order'"
      (action)="openNewOrderModal()"
      ></lib-empty-state>
    }
  }

  @if(hasMoreData){<ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
    <ion-infinite-scroll-content
    loadingSpinner="bubbles"
    loadingText="processing..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>}
  </div>
</ion-content>
