<!-- PRICING SECTION -->
<section id="pricing" class="max-w-7xl mx-auto py-20 bg-white">
  <div class="px-4 sm:px-6 lg:px-8">
    <!-- Section Header -->
    <div class="text-center max-w-2xl mx-auto mb-16 space-y-5">
      <p class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
        Choose your plan
      </p>
      <p class="text-base text-gray-400">
        Upgrade to our premium plan and enjoy exclusive benefits, 
        with the flexibility to choose between convenient monthly 
        or cost-effective annual payment options for an enhanced 
        design experience.
      </p>
    </div>

    <!-- Pricing Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 max-w-4xl mx-auto items-stretch">
      
      <!-- Monthly Plan -->
      @for(plan of plans(); track plan._id){
        <lib-pricing-card 
        [plan]="plan"
        [isAuthenticated]="isAuthenticated"
        (initializeSubscription)="initSub($event)"
        ></lib-pricing-card>
      }
    </div>
  </div>
</section>
