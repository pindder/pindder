<!-- HERO SECTION -->
<section id="hero" class="max-w-7xl mx-auto relative overflow-hidden pt-12 pb-16 md:pt-24 md:pb-28">
  <img 
    src="images/hero_background.png" 
    alt="bg_image" 
    aria-hidden="true"
    class="absolute -z-10 inset-0 h-full w-full object-cover"
  />

  <!-- Hero Text-->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-center flex-col gap-5 text-center">
      <p class="max-w-5xl text-5xl leading-relaxed font-bold">Elevate Your Fashion Design Business with Our <span class="text-[#F1641D]">All-in-One</span> Solution</p>
      <p class="text-gray-400">Effortlessly collect client data and seamlessly manage orders. The ultimate tool for fashion designers!</p>
    </div>
  </div>

  <!-- Store Download Buttons-->
  <div class="flex gap-5 justify-center items-center my-5">
    <a 
      href="https://play.google.com/store/apps/details?id=com.pindder.app&hl=en" 
      [style]="{backgroundColor: '#FFFFFF'}" 
      class="border inline-flex items-center gap-2 px-2 rounded-xl text-white shadow-lg transition-all"
    >
      <ion-icon name="logo-google-playstore" size="large"></ion-icon>
      <div class="">
          <span class="text-xs">Get it on</span>
          <p class="font-semibold">Google Play</p>
      </div>
    </a>
    <a 
      href="https://apps.apple.com/us/app/pindder/id6797538451" 
      [style]="{backgroundColor: '#FFFFFF'}" 
      class="border inline-flex items-center gap-2 px-2 rounded-xl text-white shadow-lg transition-all"
    >
      <ion-icon name="logo-apple" size="large"></ion-icon>
      <div>
          <span class="text-xs">Download on the</span>
          <p class="font-semibold">App Store</p>
      </div>
    </a>
  </div>

  <!-- Image shows-->
  <div class="max-w-6xl mx-auto mt-20">
    <div class="overflow-x-auto sm:overflow-x-visible inline-flex justify-center items-center gap-5">
      @for(img of images; track $index){
        <img [src]="img" alt="" class="w-100 h-52"/>
      }
    </div>
  </div>
</section>
