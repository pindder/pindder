  # ==========================================
  # IOS BUILD & DEPLOY JOB (macOS)
  # ==========================================
  deploy-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Ionic Web App (Nx)
        run: npx nx run mobile:build:production

      - name: Sync Capacitor iOS
        run: npx nx run mobile:cap-sync-ios

      - name: Increment iOS Build Number
        run: |
          PLIST_PATH="apps/mobile/ios/App/App/Info.plist"
          echo "Updating CFBundleVersion to ${{ github.run_number }} in $PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion '${{ github.run_number }}'" "$PLIST_PATH"
        shell: bash

      - name: Install CocoaPods
        run: |
          cd apps/mobile/ios/App
          pod install

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: apps/mobile/ios/App

      - name: Run Fastlane TestFlight Deployment
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          cd apps/mobile/ios/App
          bundle exec fastlane ios beta