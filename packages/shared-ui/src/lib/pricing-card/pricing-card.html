<div class="bg-white rounded-3xl p-8 sm:p-10 flex flex-col justify-between space-y-8"
    [ngClass]="{'border-2 border-[#F1641D]': plan.recommended, 'border border-slate-200': !plan.recommended }"
>
    <ion-card class="sub-card" [class.popular]="plan.recommended">
        <!-- Popular Highlight Badge -->
        @if(plan.recommended){
          <div class="popular-badge">Most Popular</div>
        }

        <ion-card-header>
          <ion-card-subtitle>{{ plan.description }}</ion-card-subtitle>
          <ion-card-title>{{ plan.name }}</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ul class="features-list">
            @for(feat of plan.features; track feat){
              <li>
                <ion-icon name="checkmark-circle" color="success"></ion-icon>
                <span>{{ feat }}</span>
              </li>
            }
          </ul>

          @if(isAuthenticated){
          <a (click)="initializeSubscription.emit(plan._id!)" class="w-full py-3.5 rounded-xl brand-button font-bold text-center block text-sm shadow-md">
              Get Started
          </a>
          }
          @else{
          <a routerLink="/auth/register?acctType=tailor" class="w-full py-3.5 rounded-xl brand-button font-bold text-center block text-sm shadow-md">
              Get Started
          </a>}
        </ion-card-content>
    </ion-card>
</div>
